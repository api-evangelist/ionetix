          type: string
          description: Machine-readable error code, e.g. rest_forbidden.
        message:
          type: string
          description: Human-readable message.
        data:
          type: object
          properties:
            status:
              type: integer
      required:
      - code
      - message
    media:
      $schema: http://json-schema.org/draft-04/schema#
      title: attachment
      type: object
      properties:
