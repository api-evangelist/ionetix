id_conventions:
  scheme: opaque positive integers assigned by WordPress, unique per post-type table
  prefixes: none
  note: >-
    Post and page ids share one sequence (both are `post` rows), so an id is only meaningful together
    with its collection. Terms (categories, tags) use a separate sequence and can collide numerically
    with post ids.
traversal:
  _links: >-
    Every resource embeds a HAL-style _links object naming its author, replies, wp:featuredmedia,
    wp:attachment and wp:term relations. Adding ?_embed inlines those resources, which is the cheapest
    way for an agent to resolve the graph above in one request instead of N.
note: >-
  This is the CMS content graph behind ionetix.com. It carries no clinical, dose, isotope-supply,
  cyclotron-telemetry or order data — Ionetix exposes none of that through any public interface.
