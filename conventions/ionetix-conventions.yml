auth:
  style: http-basic
  scheme: WordPress Application Passwords over HTTP Basic
  anonymous_read: true
  authorization_endpoint: https://ionetix.com/wp-admin/authorize-application.php
  note: >-
    Advertised by the route index's `authentication` block. Read access to every wp/v2 content
    collection profiled here is anonymous; all write access requires the Basic credential.
