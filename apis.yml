aid: ionetix
name: Ionetix
description: >-
  Ionetix (IONETIX Corporation) is a Lansing, Michigan radiopharmaceutical and cyclotron company
  founded in 2009 out of technology developed at the MIT Plasma Science and Fusion Center. It built
  the first commercial compact superconducting cyclotron, the ION-12SC, and operates a distributed
  network of those cyclotrons installed on or near the campuses of hospital PET programs to produce
  N-13 Ammonia, a short-half-life PET tracer used for cardiac perfusion imaging and the detection of
  coronary artery disease, sold to providers on a pay-by-the-dose basis. Alongside the cardiac PET
  network the company runs an alpha isotope manufacturing facility in Lansing built around a 30 MeV
  cyclotron for commercial-scale production of Actinium-225 and Astatine-211 for targeted alpha
  therapy, has an approved ANDA for Gallium Ga-68 Gozetotide (PSMA-11), and supply and development
  partnerships with AlfaRim Medical and Cellectar Biosciences. Ionetix completed a $30M+ financing
  and go-public transaction in April 2026. Ionetix publishes no developer platform, no API
  documentation, no SDK and no developer portal; the only machine-readable surface on ionetix.com is
  the WordPress REST API at /wp-json/, whose wp/v2 namespace is anonymously readable and serves the
  company newsroom, careers postings, conference and case-study archives, product pages, leadership
  profiles, the media library (including the ION-12SC cyclotron data sheet PDFs) and a site-wide
  search endpoint as JSON. The WordPress Abilities API namespace (wp-abilities/v1) is registered on
  the site but returns HTTP 401 to anonymous callers, and no MCP namespace is registered.
